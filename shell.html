<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nairobi Streets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        #canvas { border: 2px solid #0f3460; border-radius: 8px; box-shadow: 0 0 30px rgba(15, 52, 96, 0.5); }
        .header { color: #e94560; text-align: center; padding: 20px; text-shadow: 0 0 10px rgba(233, 69, 96, 0.5); }
        .controls { color: #fff; margin-top: 15px; font-size: 14px; line-height: 1.8; background: rgba(15, 52, 96, 0.8); padding: 15px 25px; border-radius: 8px; border: 1px solid #0f3460; }
        .controls kbd { background: #0f3460; padding: 2px 8px; border-radius: 4px; border: 1px solid #e94560; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NAIROBI STREETS</h1>
        <p>Survive the streets. Complete missions. Build respect.</p>
    </div>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <strong>Controls:</strong><br>
        <kbd>WASD</kbd> Move &nbsp; <kbd>Mouse</kbd> Aim &nbsp; <kbd>LMB</kbd> Shoot &nbsp; <kbd>RMB</kbd> Block/Dodge &nbsp; <kbd>Shift</kbd> Sprint &nbsp; <kbd>E</kbd> Interact &nbsp; <kbd>Tab</kbd> Map &nbsp; <kbd>M</kbd> Missions &nbsp; <kbd>P</kbd> Pause
    </div>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function() {
                console.log('Nairobi Streets loaded!');
            },
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); }
        };
    </script>
    <script src="nairobi_streets.js"></script>
</body>
</html>
