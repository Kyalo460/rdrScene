[build]
  command = "git clone https://github.com/emscripten-core/emsdk.git /tmp/emsdk && cd /tmp/emsdk && ./emsdk install latest && ./emsdk activate latest && source ./emsdk_env.sh && cd $NETLIFY_REPO_DIR && make web"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/nairobi_streets.html"
  status = 200

[headers]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000"

  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000"