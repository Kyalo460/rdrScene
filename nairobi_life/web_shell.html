<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nairobi Life</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #0d0f12;
            color: #e8e6e0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        #wrap {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            border: 1px solid #2a2f36;
            border-radius: 6px;
            image-rendering: auto;
            max-width: 100%;
            max-height: 82vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }
        .title {
            color: #f4a23b;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 14px rgba(244,162,59,0.35);
        }
        .sub { color: #9aa0a6; font-size: 14px; margin-bottom: 12px; }
        .controls {
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.9;
            color: #c9ccd1;
            background: rgba(20,24,28,0.9);
            padding: 12px 22px;
            border-radius: 8px;
            border: 1px solid #262b31;
            text-align: center;
        }
        kbd {
            background: #1c2127;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #f4a23b;
            font-family: monospace;
        }
        #loading {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0d0f12; color: #f4a23b; font-size: 18px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Nairobi Life&hellip; (compiling world)</div>
    <div id="wrap">
        <div class="title"><h1>NAIROBI LIFE</h1></div>
        <div class="sub">Survive the streets. Real weather, real prices, real Nairobi.</div>
        <canvas id="canvas"></canvas>
        <div class="controls">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp;
            <kbd>Shift</kbd> Sprint &nbsp;
            <kbd>E</kbd> Interact / Work / Buy &nbsp;
            <kbd>,</kbd> <kbd>.</kbd> Time speed &nbsp;
            <kbd>Wheel</kbd> Zoom &nbsp;
            <kbd>P</kbd> Pause &nbsp;
            <kbd>F1</kbd> Help &nbsp;
            <kbd>F3</kbd> Debug
        </div>
    </div>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function() {
                var l = document.getElementById('loading');
                if (l) l.style.display = 'none';
            },
            print: function(text) { console.log('[nairobi_life] ' + text); },
            printErr: function(text) { console.error('[nairobi_life] ' + text); }
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
